[project]
name = "heal-her-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "cryptography>=47.0.0",
    "fastapi[standard]>=0.136.1",
    "granian>=2.7.4",
    "guardrails-ai @ git+https://github.com/guardrails-ai/guardrails.git"
    "passlib[argon2]>=1.7.4",
    "pii-masker>=0.1.2",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "redis>=7.4.0",
    "strawberry-graphql[fastapi]>=0.315.3",
    "supabase>=2.29.0",
    "uuid6>=2025.0.1",
]

[tool.mypy]
# ignores errors for third-party libraries and internal modules missing py.typed stubs
ignore_missing_imports = true

# allows variables to default to None without needing strict Optional[] types
implicit_optional = true

# tells mypy how to correctly read pydantic models and settings without throwing missing argument errors
plugins = ["pydantic.mypy"]

# TARGETED FIX: explicitly disables the strict dynamic property checks causing the remaining 10 errors
disable_error_code = [
    "var-annotated", 
    "attr-defined", 
    "index", 
    "union-attr"
]

# completely silences the shadowing warnings for any file named types.py in your project
[[tool.mypy.overrides]]
module = "*.types"
ignore_errors = true